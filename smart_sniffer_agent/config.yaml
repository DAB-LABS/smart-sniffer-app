name: "SMART Sniffer App"
description: "Drive health for the drives in this Home Assistant box, on its own page. The SMART Sniffer integration adds your other machines, entities, history, notifications and automations."
version: "0.4.0-dev"
slug: "smart_sniffer_agent"
url: "https://github.com/DAB-LABS/smart-sniffer-app"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto

# Network
ports:
  9099/tcp: 9099
ports_description:
  9099/tcp: "SMART Sniffer Agent API"

# Drive access — smartctl needs raw I/O to read SMART data from host drives.
# SYS_RAWIO: required for SATA drives (SG_IO ioctls)
# SYS_ADMIN: required for NVMe drives (NVMe admin passthrough commands)
privileged:
  - SYS_RAWIO
  - SYS_ADMIN

# Full hardware access — required for smartctl to open drive device nodes.
# Without this, the container's /dev is read-only and the device cgroup blocks
# raw I/O to drives. This is the same approach Scrutiny uses.
# Users must also disable Protection Mode in the app settings for drive access.
full_access: true

# Supervisor API access: the HA hostname for a unique mDNS name, the app's own
# options, and the discovery message for the integration
hassio_api: true

# Home Assistant Core API access: tells which SMART Sniffer integration is
# installed, and adds this box to it
homeassistant_api: true

# Supervisor discovery: tells integration 0.9 and later where this box's agent
# is (host and port only). Posted only while that integration is installed.
discovery:
  - smart_sniffer

# /media: USB drives HA mounts there, measured for disk space. /share is no
# longer mapped: replicas moved into the integration, and the files users
# kept in /share/smart-sniffer/replicas stay where they are.
map:
  - media:ro

# AppArmor — custom profile (apparmor.txt) provides the Protection Mode toggle
# in the HA UI and documents what the container actually accesses.
# Security note: Protection Mode must be OFF for drive monitoring to work.
# With full_access + custom apparmor, score is approximately 4/8.

# Ingress — serves the unified web UI inside the HA sidebar
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:harddisk-plus
panel_title: "SMART Sniffer App"

# Health monitoring
watchdog: "http://[HOST]:[PORT:9099]/api/health"

# User-configurable options. hosts, card_order, hidden_cards, thresholds,
# card_names and host_names are what 0.3.x kept for the field machines and
# cards; 0.4.0 hands the field machines' part to the integration (v0.9 and
# later) and removes it here as the integration confirms it. This box's own
# entries stay, and its thresholds are still read.
options:
  port: 9099
  token: ""
  scan_interval: 60
  hosts: []
  card_order: []
  hidden_cards: []
  thresholds: []
  card_names: []
  host_names: []
schema:
  port: port
  token: "password?"
  scan_interval: "int(10,3600)"
  hosts:
    - address: str
      port: port
      password: "password?"
      hidden: "bool?"
      removed:
        - "str?"
  card_order:
    - "str?"
  hidden_cards:
    - "str?"
  thresholds:
    - card: str
      label: str
      value: "int(0,)"
  card_names:
    - card: str
      name: str
  host_names:
    - host: str
      name: str

# Container image (uncomment for published releases, must be removed for local builds)
# image: "ghcr.io/dab-labs/{arch}-smart-sniffer-agent"

# Mark as experimental during development
stage: experimental
