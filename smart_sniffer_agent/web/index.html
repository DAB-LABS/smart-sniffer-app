<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMART Sniffer Control Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='6.5' cy='6.5' r='4.5' fill='none' stroke='%238f8f8f' stroke-width='1.8'/%3E%3Cpath d='M10 10l4.5 4.5' stroke='%238f8f8f' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="cc.css">
<script>window.tailwind = { config: { corePlugins: { preflight: false } } };</script>
<script src="tailwind.min.js"></script>
<script>if (window.tailwind && tailwind.config) tailwind.config = { corePlugins: { preflight: false } };</script>
<script src="cc.js" defer></script>
<script src="alpine.min.js" defer></script>
</head>
<body x-data="cc()">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="lock" viewBox="0 0 12 14"><rect x="1.5" y="6.2" width="9" height="6.8" rx="1"/><path d="M3.7 6.2V4.3a2.3 2.3 0 0 1 4.6 0v1.9"/></symbol>
  <symbol id="exit" viewBox="0 0 14 14"><path d="M6.2 2.2H2.2v9.6h9.6V7.8"/><path d="M8.6 1.6h3.8v3.8M12.4 1.6 6.6 7.4"/></symbol>
  <symbol id="eye" viewBox="0 0 16 16"><path d="M1.2 8C3 4.9 5.3 3.4 8 3.4s5 1.5 6.8 4.6C13 11.1 10.7 12.6 8 12.6S3 11.1 1.2 8Z"/><circle cx="8" cy="8" r="2.1"/></symbol>
  <symbol id="eye-shut" viewBox="0 0 16 16"><path d="M1.2 8C3 4.9 5.3 3.4 8 3.4s5 1.5 6.8 4.6C13 11.1 10.7 12.6 8 12.6S3 11.1 1.2 8Z"/><path d="M2.6 13.4 13.4 2.6"/></symbol>
  <symbol id="trash" viewBox="0 0 16 16"><path d="M2.5 4.2h11M6.2 4.2V2.6h3.6v1.6M3.9 4.2l.7 9.2h6.8l.7-9.2M6.6 6.8v4.4M9.4 6.8v4.4"/></symbol>
  <symbol id="download" viewBox="0 0 16 16"><path d="M8 2.2v8M4.6 7.2 8 10.6l3.4-3.4M2.6 11.6v2h10.8v-2"/></symbol>
  <symbol id="grip" viewBox="0 0 10 16"><circle cx="3" cy="3" r="1.2"/><circle cx="7" cy="3" r="1.2"/><circle cx="3" cy="8" r="1.2"/><circle cx="7" cy="8" r="1.2"/><circle cx="3" cy="13" r="1.2"/><circle cx="7" cy="13" r="1.2"/></symbol>
  <symbol id="chevron" viewBox="0 0 20 12"><path d="M2 2l8 8 8-8"/></symbol>
  <symbol id="glass" viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="4.5"/><path d="M10 10l4.5 4.5"/></symbol>
  <symbol id="tune" viewBox="0 0 16 16"><path d="M2 4h6.5M12.5 4H14M2 8h1.5M7.5 8H14M2 12h7.5M13.5 12h.5"/><circle cx="10.5" cy="4" r="1.7"/><circle cx="5.5" cy="8" r="1.7"/><circle cx="11.5" cy="12" r="1.7"/></symbol>
  <symbol id="pencil" viewBox="0 0 16 16"><path d="M10.6 2.6l2.8 2.8M3 13l.7-3.4 7.9-7.9 2.7 2.7-7.9 7.9L3 13Z"/></symbol>
  <symbol id="copy" viewBox="0 0 16 16"><rect x="5.2" y="5.2" width="8.3" height="8.3" rx="1"/><path d="M10.8 5.2V3.5a1 1 0 0 0-1-1H3.5a1 1 0 0 0-1 1v6.3a1 1 0 0 0 1 1h1.7"/></symbol>
</svg>

<main class="page">
  <header class="app-head">
    <div class="brand">
      <img class="mark" src="img/mark.png" alt="" width="42" height="42" onerror="this.hidden=true;this.nextElementSibling.hidden=false">
      <svg class="mark glass" hidden aria-hidden="true"><use href="#glass"/></svg>
      <img class="wordmark" src="img/wordmark.png" alt="SMART Sniffer" width="252" height="27">
      <span class="page-name">Control Center</span>
    </div>
    <div class="head-side">
      <div class="versions"><span x-show="info && info.app_version">app <b x-text="info && info.app_version"></b></span><span class="v-agent"><i class="agent-dot" :class="agentState" :title="agentDotTitle" role="img" :aria-label="agentDotTitle"></i><span x-show="agentVersion">agent <b x-text="agentVersion"></b></span><span x-show="!agentVersion && agentDown">agent not answering</span><span x-show="!agentVersion && !agentDown">agent</span></span><span x-show="info" title="Integration rules this app judges drives with">rules <b x-text="rulesVersion || 'not loaded'"></b></span></div>
      <div class="head-tools">
        <button class="btn btn-sm eye-btn" type="button" :aria-pressed="showHidden ? 'true' : 'false'" :disabled="!hiddenCount && !showHidden" :aria-label="showHidden ? 'Hidden cards shown, ' + hiddenCount : hiddenCount + ' hidden, press to see them'" title="Hidden cards" @click="toggleShowHidden()"><svg class="eye-g" aria-hidden="true" x-show="!showHidden"><use href="#eye-shut"/></svg><svg class="eye-g" aria-hidden="true" x-show="showHidden" style="display:none"><use href="#eye"/></svg><span x-text="hiddenCount">0</span></button>
        <button class="btn btn-sm" type="button" @click="refresh()">Refresh</button>
      </div>
    </div>
  </header>
  <!-- This app's own agent, on one line, with what to type into the integration -->
  <template x-if="topAgent">
    <section class="agent-line" aria-label="This app's agent">
      <span class="sec-label al-name">HAOS SMART AGENT:</span>
      <span class="cp"><span class="cp-v mono" x-text="topAgent.addr"></span><button class="copy" type="button" aria-label="Copy the agent address" title="Copy" @click="copy($event, topAgent.addr, 'top:addr')"><svg aria-hidden="true"><use href="#copy"/></svg></button><small class="copied" role="status" x-show="ui.copied === 'top:addr'" x-text="ui.copiedText"></small></span>
      <template x-if="topAgent.mdns"><span class="cp al-mdns"><span class="cp-k">mDNS</span><span class="cp-v mono" x-text="topAgent.mdns"></span><button class="copy" type="button" aria-label="Copy the mDNS name" title="Copy" @click="copy($event, topAgent.mdns, 'top:mdns')"><svg aria-hidden="true"><use href="#copy"/></svg></button><small class="copied" role="status" x-show="ui.copied === 'top:mdns'" x-text="ui.copiedText"></small></span></template>
    </section>
  </template>
  <p class="sec-label sec-drives">DRIVES:</p>
  <p class="page-err" x-show="pageErr || hostsErr" x-text="pageErr || hostsErr" role="alert"></p>
  <template x-if="selfEmpty">
    <p class="empty-line">This machine's agent reports no readable drives. If the <a :href="appPage('logs')" target="_top">Mission Log</a> says DRIVE ACCESS BLOCKED, turn off Protection Mode on the <a :href="appPage('info')" target="_top">app's info page</a> and restart the app.</p>
  </template>

  <!-- ═══ One grid: a card per drive, pool or filesystem, then + ═══ -->
  <div class="grid" :class="{ dragging: !!drag }">
    <template x-for="c in shownCards" :key="c.id">
      <article class="card" :class="cardClass(c)" :data-card="c.id" :aria-label="pill(c) + ', ' + title(c)">
        <div class="c-head">
          <button class="grip" type="button" :aria-label="'Move ' + title(c) + '. Arrow keys move it one place.'" title="Drag to move" @pointerdown="gripDown($event, c)" @keydown="gripKey($event, c)" @contextmenu.prevent><svg aria-hidden="true"><use href="#grip"/></svg></button>
          <div class="c-name">
            <template x-if="!renaming(c, 'title')"><h3 class="c-title" x-text="title(c)" @dblclick="startRename(c, 'title')"></h3></template>
            <template x-if="renaming(c, 'title')"><input class="name-in c-title" type="text" maxlength="100" spellcheck="false" autocomplete="off" :aria-label="'Name of ' + baseTitle(c) + '. Enter saves, Esc cancels, empty restores the original.'" :placeholder="baseTitle(c)" x-model="ui.rename.value" @keydown="renameKey($event)" @blur="finishRename(true)"></template>
            <template x-if="canRename(c) && !renaming(c, 'title')"><button class="pencil" type="button" :aria-label="'Rename ' + title(c)" title="Rename" @click="startRename(c, 'title')"><svg aria-hidden="true"><use href="#pencil"/></svg></button></template>
          </div>
          <div class="c-tags">
            <span class="exit-slot">
              <template x-if="glyph(c).kind === 'blue'"><a class="exit" :href="glyph(c).href" target="_top" aria-label="Open in Home Assistant" title="Open in Home Assistant"><svg aria-hidden="true"><use href="#exit"/></svg></a></template>
              <template x-if="glyph(c).kind === 'grey'"><button class="exit add" type="button" :aria-expanded="asking(c) ? 'true' : 'false'" aria-label="Not in Home Assistant yet. Add it" title="Not in Home Assistant yet" @click="askAdd(c)"><svg aria-hidden="true"><use href="#exit"/></svg></button></template>
            </span>
            <template x-if="!renaming(c, 'pill')"><span class="pill" :class="{ 'pill-ed': canRenameHost(c) }" x-text="pill(c)" @dblclick="startRename(c, 'pill')"></span></template>
            <template x-if="renaming(c, 'pill')"><input class="name-in pill" type="text" :style="'width:calc(' + Math.max(6, String(ui.rename.value || '').length + 1) + 'ch + 14px)'" maxlength="100" spellcheck="false" autocomplete="off" :aria-label="'Name of this machine. Enter saves, Esc cancels, empty restores the original.'" x-model="ui.rename.value" @keydown="renameKey($event)" @blur="finishRename(true)"></template>
            <template x-if="canRenameHost(c) && !renaming(c, 'pill')"><button class="pencil p-pen" type="button" :aria-label="'Rename the machine ' + machine(c)" title="Rename the machine" @click="startRename(c, 'pill')"><svg aria-hidden="true"><use href="#pencil"/></svg></button></template>
          </div>
        </div>
        <template x-if="asking(c)">
          <div class="ask" role="group" aria-label="Confirm"><span x-text="ui.confirm.text"></span><span class="ask-btns"><button class="btn btn-sm btn-primary" type="button" :disabled="ui.confirm.busy" @click="confirmAdd()">Add</button><button class="btn btn-sm btn-quiet" type="button" @click="closeConfirm()">Cancel</button></span><span class="ask-err" x-show="ui.confirm.err" x-text="ui.confirm.err"></span></div>
        </template>
        <div class="c-where"><template x-if="scenOn(c)"><span class="scen-box"><span class="scen-size" aria-hidden="true" x-text="scenLabel(c.it)"></span><select class="scen" :class="{ empty: !scenarioName(c.it) }" aria-label="Scenario" :disabled="!!ui.busy['scen:' + c.id]" @change="pickScenario(c, $event.target.value)"><template x-if="!scenarioName(c.it)"><option value="" disabled selected>Choose scenario</option></template><template x-for="o in scenOptions(c.it)" :key="o.id"><option :value="o.id" :selected="o.id === scenCurrent(c.it)" x-text="o.label"></option></template></select></span></template><template x-for="(w, i) in where(c)" :key="i"><span x-text="w"></span></template></div>
        <template x-if="vitals(c).length">
          <div class="c-vitals"><template x-for="(v, i) in vitals(c)" :key="i"><span x-text="v"></span></template></div>
        </template>

        <!-- Disk space: one bar per filesystem, up to three -->
        <template x-if="spaces(c).length">
          <div class="space">
            <template x-for="f in spaceShown(c)" :key="f.id || f.mountpoint">
              <div class="sp-row" :class="spaceStep(f)" :data-pct="pct(f)">
                <span class="sp-mount" x-text="f.mountpoint" :title="f.mountpoint"></span>
                <span class="sp-bar" role="img" :aria-label="f.mountpoint + ', ' + (f.status === 'unavailable' ? 'not mounted' : pct(f) + '% used')"><i :style="'width:' + spaceFill(f) + '%'"><b x-text="spaceInside(f)"></b></i></span>
                <span class="sp-text" x-text="spaceText(f)"></span>
              </div>
            </template>
            <template x-if="spaceMore(c)"><div class="sp-more" x-text="'and ' + spaceMore(c) + ' more'"></div></template>
          </div>
        </template>

        <!-- The health box: one frame in the state colour around the health
             line and its chevron, the first three problem rows closed, and
             all of Details open. Nothing in it scrolls. It sits at the
             bottom of the card, on the footer rule; spare height goes above. -->
        <template x-if="health(c) && c.kind !== 'down'">
          <div class="hwrap"><div class="hbox" :class="health(c)">
            <div class="c-health">
              <template x-if="health(c) === 'attention'"><span class="h-att">Attention</span></template>
              <template x-if="health(c) === 'attention' && failed(c)"><span class="h-fail">Health <b>FAILED</b></span></template>
              <template x-if="health(c) === 'maybe'"><span class="h-maybe">Maybe</span></template>
              <template x-if="health(c) === 'ok'"><span class="h-ok">Health OK</span></template>
              <template x-if="health(c) === 'unknown'"><span class="h-unk"><span class="ghost-dot" aria-hidden="true"></span>Health not known</span></template>
              <template x-if="isOpen(c) && canTune(c)">
                <button class="tune" type="button" :aria-pressed="thrEditing(c) ? 'true' : 'false'" :aria-label="thrEditing(c) ? 'Stop editing thresholds' : 'Edit thresholds'" title="Thresholds" @mousedown.prevent="$el.blur()" @click="toggleThr(c)"><svg aria-hidden="true"><use href="#tune"/></svg></button>
              </template>
              <template x-if="hasDetails(c)">
                <button class="chev" :class="health(c)" type="button" :aria-expanded="isOpen(c) ? 'true' : 'false'" :aria-label="isOpen(c) ? 'Hide details' : 'Details'" title="Details" @mousedown.prevent="$el.blur()" @click="toggleOpen(c)"><svg aria-hidden="true"><use href="#chevron"/></svg></button>
              </template>
            </div>
            <template x-if="unsupportedNote(c) && !isOpen(c)"><p class="c-note">The agent can see this drive, but it gives no SMART health data to watch.</p></template>
            <template x-if="c.kind === 'pool' && vanished(c.it)"><p class="c-note">Not served to Home Assistant, which reports this pool as missing.</p></template>
            <template x-if="!isOpen(c) && problems(c).length">
              <div class="pw">
                <template x-for="p in problems(c).slice(0, 3)" :key="p.key">
                  <div class="pw-row" :class="p.mark"><span class="pw-label"><span class="lb" x-text="p.label"></span><template x-if="p.note"><small x-text="' (' + p.note + ')'"></small></template></span><span class="pw-val" x-text="p.value"></span></div>
                </template>
                <template x-if="problems(c).length > 3"><button class="pw-more" type="button" :aria-label="'and ' + (problems(c).length - 3) + ' more. Details'" @click="toggleOpen(c)" x-text="'and ' + (problems(c).length - 3) + ' more'"></button></template>
              </div>
            </template>
            <template x-if="isOpen(c) && c.kind === 'drive'">
              <div class="details">
                <template x-if="renamed(c)"><p class="c-model" x-text="modelLine(c)"></p></template>
                <template x-if="unsupportedNote(c)"><p class="c-note">The agent can see this drive, but it gives no SMART health data to watch.</p></template>
                <dl class="kv">
                  <div><dt><span class="lb">Data Read</span><template x-if="vol(c.it, 'read')"><small x-text="' (' + volNote(vol(c.it, 'read')) + ')'"></small></template></dt><dd><span class="v" :class="{ na: !vol(c.it, 'read') }" x-text="vol(c.it, 'read') ? tb(vol(c.it, 'read').bytes) : 'not reported'"></span></dd></div>
                  <div><dt><span class="lb">Device Statistics</span><template x-if="devstat(c.it).note"><small x-text="' (' + devstat(c.it).note + ')'"></small></template></dt><dd><span class="v" x-text="devstat(c.it).value"></span></dd></div>
                </dl>
                <template x-if="connect(c)">
                  <div class="conn" role="group" aria-label="Connect by hand">
                    <span class="conn-h">Connect by hand</span>
                    <template x-for="f in connect(c).fields" :key="f.k">
                      <span class="cp"><span class="cp-k" x-text="f.k"></span><span class="cp-v mono" x-text="f.v"></span><button class="copy" type="button" :aria-label="'Copy ' + f.k" title="Copy" @click="copy($event, f.v, c.id + ':' + f.k)"><svg aria-hidden="true"><use href="#copy"/></svg></button><small class="copied" role="status" x-show="ui.copied === c.id + ':' + f.k" x-text="ui.copiedText"></small></span>
                    </template>
                    <template x-if="connect(c).password"><p class="conn-note">This agent wants its password (the token: line in its config)</p></template>
                  </div>
                </template>
                <template x-if="spaces(c).length">
                  <div class="fs-list">
                    <template x-for="f in spaces(c)" :key="f.id || f.mountpoint">
                      <div class="fs-line"><span><span class="mono" x-text="f.mountpoint"></span> <small x-text="f.fstype"></small></span><span class="fs-used" x-text="spaceUsed(f)"></span></div>
                    </template>
                  </div>
                </template>
                <!-- One table: the attributes (or the NVMe health log, or the
                     watched rows), flagged rows in the state colour, notes muted
                     after the name. -->
                <template x-if="thrEditing(c)">
                  <div class="thr" role="group" aria-label="Thresholds">
                    <template x-if="thrS.loading"><p class="c-note">Reading the thresholds.</p></template>
                    <template x-if="thrRows(c).length">
                      <div class="table-wrap">
                        <table class="attrs thr-t">
                          <thead><tr><th class="nm">Watched</th><th class="num">Now</th><th class="num">Alert above</th><th class="num">Default</th></tr></thead>
                          <tbody>
                            <template x-for="l in thrRows(c)" :key="l.label">
                              <tr :class="thrMark(c, l)">
                                <td class="nm"><span class="lb" x-text="l.name"></span><template x-if="l.compare !== 'gt'"><small x-text="' (' + thrWord(l) + ')'"></small></template></td>
                                <td class="num" x-text="thrReading(l)"></td>
                                <td class="num"><input class="input thr-in" inputmode="numeric" autocomplete="off" :value="thrS.values[l.label]" :aria-label="'Threshold of ' + l.name + ', ' + thrWord(l)" @input="thrSet(l.label, $event.target.value)" @keydown.enter="thrSave(c)"></td>
                                <td class="num def" x-text="l.default + (l.unit || '')"></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </template>
                    <template x-if="thrS.data"><p class="thr-where" x-text="thrWhere()"></p></template>
                    <template x-if="thrS.ask === 'accept'">
                      <div class="ask" role="group" aria-label="Confirm accept"><span x-text="thrAcceptText(c)"></span><span class="ask-btns"><button class="btn btn-sm btn-primary" type="button" :disabled="thrS.busy" @click="thrAccept(c)">Accept</button><button class="btn btn-sm btn-quiet" type="button" @click="thrAsk(null)">Cancel</button></span></div>
                    </template>
                    <template x-if="thrS.ask === 'reset'">
                      <div class="ask" role="group" aria-label="Confirm reset"><span>Put every threshold of this drive back to its default?</span><span class="ask-btns"><button class="btn btn-sm btn-primary" type="button" :disabled="thrS.busy" @click="thrReset(c)">Reset</button><button class="btn btn-sm btn-quiet" type="button" @click="thrAsk(null)">Cancel</button></span></div>
                    </template>
                    <p class="thr-err" role="alert" x-show="thrS.err" x-text="thrS.err"></p>
                    <div class="thr-btns">
                      <button class="btn btn-sm btn-primary" type="button" :disabled="!thrS.data || thrS.busy" @click="thrSave(c)">Save</button>
                      <button class="btn btn-sm" type="button" :aria-expanded="thrS.ask === 'accept' ? 'true' : 'false'" :disabled="!thrS.data || thrS.busy || !thrFlagged(c).length" @click="thrAsk('accept')">Accept current readings</button>
                      <button class="btn btn-sm" type="button" :aria-expanded="thrS.ask === 'reset' ? 'true' : 'false'" :disabled="!thrS.data || thrS.busy" @click="thrAsk('reset')">Reset to defaults</button>
                      <button class="btn btn-sm btn-quiet" type="button" @click="ui.thr = null">Cancel</button>
                    </div>
                  </div>
                </template>
                <template x-if="!thrEditing(c) && detailTable(c.it).rows.length">
                  <div class="table-wrap">
                    <table class="attrs" :class="detailTable(c.it).kind">
                      <thead>
                        <template x-if="detailTable(c.it).kind === 'ata'"><tr><th class="num c-id">ID</th><th class="nm">Name</th><th class="num c-val" title="The maker&#39;s health score for this attribute, counting down from new">Value</th><th class="num c-worst" title="The lowest that score has been">Worst</th><th class="num c-thresh" title="The maker&#39;s failure point for that score">Thresh</th><th class="num c-raw" title="The real count or reading. Alerts use this">Raw</th></tr></template>
                        <template x-if="detailTable(c.it).kind !== 'ata'"><tr><th class="nm">Name</th><th class="num c-raw" title="The real count or reading. Alerts use this">Value</th></tr></template>
                      </thead>
                      <tbody>
                        <template x-for="a in detailTable(c.it).rows" :key="a.key">
                          <tr :class="a.mark">
                            <template x-if="detailTable(c.it).kind === 'ata'"><td class="num c-id" x-text="a.id"></td></template>
                            <td class="nm" :title="a.name"><span class="lb" x-text="a.name"></span><template x-if="a.note"><small x-text="' (' + a.note + ')'"></small></template></td>
                            <template x-if="detailTable(c.it).kind === 'ata'"><td class="num c-val" x-text="a.value"></td></template>
                            <template x-if="detailTable(c.it).kind === 'ata'"><td class="num c-worst" x-text="a.worst"></td></template>
                            <template x-if="detailTable(c.it).kind === 'ata'"><td class="num c-thresh" x-text="a.thresh"></td></template>
                            <td class="num c-raw"><template x-if="a.missing"><span class="na" x-text="a.gap"></span></template><template x-if="!a.missing && !(c.src === 'replicas' && a.edit)"><span x-text="detailTable(c.it).kind === 'ata' ? a.raw : a.value"></span></template><template x-if="!a.missing && c.src === 'replicas' && a.edit"><input class="input raw-in" :value="a.rawValue" inputmode="numeric" :aria-label="'Raw value of ' + a.name" @change="editRaw(c.it, a.edit, a.field, $event.target.value)"></template></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
              </div>
            </template>
            <template x-if="isOpen(c) && c.kind === 'pool'">
              <div class="details">
                <template x-if="renamed(c)"><p class="c-model" x-text="modelLine(c)"></p></template>
                <template x-if="connect(c)">
                  <div class="conn" role="group" aria-label="Connect by hand">
                    <span class="conn-h">Connect by hand</span>
                    <template x-for="f in connect(c).fields" :key="f.k">
                      <span class="cp"><span class="cp-k" x-text="f.k"></span><span class="cp-v mono" x-text="f.v"></span><button class="copy" type="button" :aria-label="'Copy ' + f.k" title="Copy" @click="copy($event, f.v, c.id + ':' + f.k)"><svg aria-hidden="true"><use href="#copy"/></svg></button><small class="copied" role="status" x-show="ui.copied === c.id + ':' + f.k" x-text="ui.copiedText"></small></span>
                    </template>
                    <template x-if="connect(c).password"><p class="conn-note">This agent wants its password (the token: line in its config)</p></template>
                  </div>
                </template>
                <template x-if="poolDisks(c.it).length">
                  <div class="table-wrap">
                    <table class="attrs" :aria-label="'Disks in pool ' + c.it.pool.name">
                      <thead><tr><th>Disk</th><th>State</th><th class="num">Read</th><th class="num">Write</th><th class="num">Cksum</th></tr></thead>
                      <tbody>
                        <template x-for="d in poolDisks(c.it)" :key="d.name">
                          <tr :class="d.bad ? 'crit' : ''"><td x-text="d.name"></td><td x-text="d.state"></td><td class="num" x-text="d.read"></td><td class="num" x-text="d.write"></td><td class="num" x-text="d.cksum"></td></tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
                <p class="c-note" x-show="poolFoot(c.it)" x-text="poolFoot(c.it)"></p>
                <template x-if="spaces(c).length">
                  <div class="fs-list">
                    <template x-for="f in spaces(c)" :key="f.id || f.mountpoint">
                      <div class="fs-line"><span><span class="mono" x-text="f.mountpoint"></span> <small x-text="f.fstype"></small></span><span class="fs-used" x-text="spaceUsed(f)"></span></div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div></div>
        </template>
        <!-- This app's agent not answering: the health line alone, unframed -->
        <template x-if="c.kind === 'down'">
          <div class="c-health"><span class="h-unk"><span class="ghost-dot" aria-hidden="true"></span>Health not known</span></div>
        </template>

        <!-- A field agent with nothing to show yet, and this app's agent down -->
        <template x-if="c.kind === 'machine'">
          <div class="m-body">
            <template x-if="machineText(c)"><p class="m-msg" x-text="machineText(c)"></p></template>
            <template x-if="pending(c.h)">
              <div>
                <p class="m-msg" x-show="!pwRefused(c.h)"><b>This agent wants a password.</b></p>
                <p class="m-msg" x-show="pwRefused(c.h)"><b>That password was refused.</b> Check it and try again.</p>
                <p class="m-msg" x-show="pwMessage(c.h)" x-text="pwMessage(c.h)"></p>
                <div class="pass">
                  <input class="input" :class="{ bad: pwRefused(c.h) }" type="password" placeholder="password" aria-label="Agent password" autocomplete="off" x-model="ui.pw[c.h.id]" @keydown.enter="authenticate(c.h)">
                  <button class="btn btn-sm btn-primary" type="button" :disabled="!!ui.busy['pw:' + c.h.id]" @click="authenticate(c.h)">Authenticate</button>
                </div>
                <p class="pass-help">It is the <span class="mono">token:</span> line in the agent's config file on that machine.</p>
              </div>
            </template>
          </div>
        </template>
        <template x-if="c.kind === 'down'">
          <div class="m-body">
            <p class="m-msg">The app may still be starting. This page asks again every 8 seconds. If it stays like this, read the <a :href="appPage('logs')" target="_top">Mission Log</a>.</p>
            <p class="m-msg dim" x-text="countdown"></p>
          </div>
        </template>

        <div class="c-spacer"></div>
        <div class="c-foot">
          <span class="seen" x-text="lastSeen(c)"></span>
          <span class="act-note" x-show="footNote(c)" x-text="footNote(c)"></span>
          <span class="icons">
            <template x-if="canDownload(c)"><button class="icon" type="button" aria-label="Save as replica" title="Save as replica" @click="download(c)"><svg aria-hidden="true"><use href="#download"/></svg></button></template>
            <template x-if="canHide(c) && !isHidden(c)"><button class="icon" type="button" aria-label="Hide this card" title="Hide this card" @click="setHidden(c, true)"><svg aria-hidden="true"><use href="#eye"/></svg></button></template>
            <template x-if="canHide(c) && isHidden(c)"><button class="icon" type="button" aria-label="Hidden. Show this card again" title="Hidden, click to show it again" @click="setHidden(c, false)"><svg aria-hidden="true"><use href="#eye-shut"/></svg></button></template>
            <template x-if="canRemove(c)"><button class="icon trash" :class="{ armed: armed(c) }" type="button" :aria-label="armed(c) ? removeText(c) + ' Press again to remove' : 'Remove this card'" :title="armed(c) ? '' : 'Remove'" :disabled="armed(c) && ui.arm.busy" @click="trashClick(c)" @pointerleave="$event.pointerType === 'mouse' && disarm(c)" @blur="disarm(c)" @keydown.escape="disarm(c)"><svg aria-hidden="true"><use href="#trash"/></svg><span class="rm-word">Remove?</span></button></template>
          </span>
        </div>
      </article>
    </template>

    <!-- The + card: one for the page, always last, never dragged. -->
    <template x-if="!add.open">
      <button class="card ghost" type="button" aria-expanded="false" @click="openAdd()">
        <span class="plus" aria-hidden="true">+</span>
        <span class="ghost-sub">Add a drive, or a replica for testing</span>
      </button>
    </template>
    <template x-if="add.open">
      <div class="card ghost-open" :class="{ wide: ui.cols >= 3 }" role="region" aria-label="Add">
        <div class="add-head"><button class="plus-close" type="button" aria-label="Close" title="Close" aria-expanded="true" @click="closeAdd()">+</button><h3>Add</h3></div>

        <div class="add-body">
        <div class="add-main">
        <section class="area area-net" aria-label="Network">
          <h4>Network</h4>
          <div class="add-line">
            <span class="pair"><span class="lbl net">Network:</span><input class="input" x-model="add.block" @input="fieldsChanged()" @keydown.enter="scan()" aria-label="Network block" spellcheck="false" autocomplete="off"></span>
            <span class="pair"><span class="lbl">Port</span><input class="input port" x-model="add.port" @input="fieldsChanged()" @keydown.enter="scan()" aria-label="Port" inputmode="numeric" autocomplete="off"></span>
            <button class="btn btn-sm" type="button" @click="scan()" x-text="scanLabel"></button>
            <template x-if="add.scan">
              <span class="scan-prog" role="status"><span class="bar" aria-hidden="true"><i :style="'width:' + scanPct + '%'"></i></span><span class="scan-of" x-show="add.scan.state === 'running'" x-text="num(add.scan.probed) + ' of ' + num(add.scan.total)"></span><span class="found"><b x-text="foundCount"></b><small>new<span class="found-old" x-show="addedCount" x-text="', ' + num(addedCount) + ' already added'"></span></small></span></span>
            </template>
            <template x-if="add.wide">
              <span class="scan-wide" role="alert"><span x-text="'That is ' + num(add.wide.addresses) + ' addresses.'"></span><button class="btn btn-sm" type="button" @click="useSuggest()" x-text="'Use ' + add.wide.suggest"></button></span>
            </template>
          </div>
          <template x-if="add.error"><p class="scan-none" role="alert" x-text="add.error"></p></template>
          <template x-if="pickRows.length">
            <div class="pick" role="group" aria-label="Agents that answered">
              <div class="pick-head"><span></span><span>Host</span><span>Address</span><span>Agent</span><span>Drives</span><span></span></div>
              <template x-for="r in pickRows" :key="r.id">
                <label class="pick-row" :data-id="r.id" :class="{ on: !r.added && add.ticks[r.id], done: r.added }"><input class="tick" type="checkbox" :checked="!r.added && !!add.ticks[r.id]" :disabled="r.added" @change="add.ticks[r.id] = $event.target.checked"><span class="h" x-text="r.added ? r.hostname + ', already added' : r.hostname"></span><span class="a" x-text="r.address + ':' + r.port"></span><span class="v" x-text="r.version ? 'agent ' + r.version : ''"></span><span class="d" x-text="driveCount(r.drives)"></span><span class="k"><template x-if="r.auth === 'password'"><svg class="lock" role="img" aria-label="wants a password"><use href="#lock"/></svg></template></span></label>
              </template>
            </div>
          </template>
          <template x-if="scanNone && !add.manualRows.length">
            <p class="scan-none">None answered on <span class="mono" x-text="add.scan.block"></span>, port <span class="mono" x-text="add.scan.port"></span>.</p>
          </template>
        </section>

        <section class="area" aria-label="Add by hand">
          <h4>Add by hand</h4>
          <div class="add-line">
            <span class="pair"><span class="lbl">Host or IP</span><input class="input host" placeholder="nas.lan or 10.0.20.14" aria-label="Host or IP" x-model="add.manualHost" @keydown.enter="check()" spellcheck="false" autocomplete="off"></span>
            <span class="pair"><span class="lbl">Port</span><input class="input port" x-model="add.manualPort" aria-label="Port" inputmode="numeric" autocomplete="off"></span>
            <button class="btn btn-sm" type="button" :disabled="add.checking" @click="check()">Check</button>
          </div>
          <p class="check-msg" :class="{ muted: add.checkMsg && add.checkMsg.muted }" role="status" x-show="add.checkMsg" x-text="add.checkMsg ? add.checkMsg.text : ''"></p>
          <p class="area-help" x-show="!add.checkMsg">A machine found here joins the Network list, ticked.</p>
        </section>
        </div>

        <section class="area" aria-label="Replicas">
          <h4>Replicas</h4>
          <div class="replica-pick" role="group" aria-label="Replica files">
            <template x-for="f in pickFiles" :key="f.id">
              <label :class="{ on: add.repTicks[f.id] }"><input class="tick" type="checkbox" :checked="!!add.repTicks[f.id]" @change="add.repTicks[f.id] = $event.target.checked"><span x-text="f.name"></span></label>
            </template>
            <div class="replica-up"><span x-text="folderOk ? 'Upload a replica' : 'Your replica folder is not available.'"></span><button class="btn btn-sm" type="button" :disabled="!folderOk || add.uploading" @click="$refs.upfile.click()">Choose file</button><span class="ext">.json</span><input type="file" accept=".json,application/json" hidden aria-label="Upload a replica" x-ref="upfile" @change="upload($event)"><span class="up-msg" x-show="add.upMsg" x-text="add.upMsg" role="alert"></span></div>
          </div>
        </section>
        </div>

        <div class="add-foot"><template x-if="tickedLock"><span><svg class="lock" aria-hidden="true"><use href="#lock"/></svg> wants a password, asked for on its card after you add it</span></template><template x-if="add.err"><span class="add-err" role="alert" x-text="add.err"></span></template><button class="btn btn-primary" type="button" :disabled="!tickCount || add.busy" @click="addTicked()" x-text="tickCount ? 'Add ' + tickCount : 'Add'"></button></div>
      </div>
    </template>
  </div>
  <div id="drag-layer" x-ignore aria-hidden="true"></div>

  <footer class="app-foot">
    <a :href="appPage('logs')" target="_top" title="The app's log in Home Assistant">Mission Log</a>
    <a :href="appPage('config')" target="_top">App configuration</a>
    <a x-show="integrationInstalled" :href="integrationUrl" target="_top">Integration</a>
    <a href="https://github.com/DAB-LABS/smart-sniffer-app" target="_blank" rel="noopener">GitHub</a>
    <span class="foot-sep" aria-hidden="true"></span>
    <span class="also">Also from DAB-LABS: <a href="https://github.com/DAB-LABS/HAIR" target="_blank" rel="noopener">HAIR, infrared remotes in Home Assistant</a></span>
    <span class="spacer"></span>
    <span class="mono" style="font-size:0.72rem">DAB-LABS</span>
  </footer>
</main>
</body>
</html>
