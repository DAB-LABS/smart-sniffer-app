configuration:
  port:
    name: Agent Port
    description: Port for the real SMART Sniffer agent API
  token:
    name: Bearer Token
    description: Optional authentication token. Must match the token in the SMART Sniffer integration config.
  scan_interval:
    name: Scan Interval
    description: How often to refresh SMART data from drives (in seconds)
  mock_port:
    name: Replica Agent Port
    description: Port of the replica agent inside the app. Not exposed on your network.
  hosts:
    name: Field Agents
    description: Other machines running the SMART Sniffer agent. Added from the Control Center.
network:
  9099/tcp: SMART Sniffer Agent API
