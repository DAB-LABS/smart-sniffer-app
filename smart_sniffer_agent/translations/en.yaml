configuration:
  port:
    name: Agent Port
    description: Port for the real SMART Sniffer agent API
  token:
    name: Bearer Token
    description: Optional authentication token. Must match the token in the SMART Sniffer integration config.
  scan_interval:
    name: Scan Interval
    description: How often to refresh SMART data from drives (in seconds)
  hosts:
    name: Field Agents
    description: Other machines running the SMART Sniffer agent, as App 0.3.x kept them. Each is handed to the SMART Sniffer integration (0.9 or later) and removed here once it has it; any left are still waiting. Add machines in the integration's Control Center now.
  card_order:
    name: Card Order
    description: The card order App 0.3.x kept. A field machine's part goes to the SMART Sniffer integration with it; this box's part stays here. Not used by the App's page.
  hidden_cards:
    name: Hidden Cards
    description: The cards hidden in App 0.3.x. A field machine's go to the SMART Sniffer integration with it; this box's stay here. Not used by the App's page.
  thresholds:
    name: Thresholds
    description: Alert thresholds App 0.3.x kept, one line per card and label. This box's still judge its cards on the App's page; a field machine's go to the SMART Sniffer integration with it.
  card_names:
    name: Card Names
    description: The card names given in App 0.3.x. A field machine's go to the SMART Sniffer integration with it; this box's stay here. Not used by the App's page.
  host_names:
    name: Machine Names
    description: The machine names given in App 0.3.x. Each goes to the SMART Sniffer integration with its machine. Not used by the App's page.
network:
  9099/tcp: SMART Sniffer Agent API
