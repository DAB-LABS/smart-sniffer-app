configuration:
  port:
    name: Agent Port
    description: Port for the real SMART Sniffer agent API
  token:
    name: Bearer Token
    description: Optional authentication token. Must match the token in the SMART Sniffer integration config.
  scan_interval:
    name: Scan Interval
    description: How often to refresh SMART data from drives (in seconds)
  mock_port:
    name: Replica Agent Port
    description: Port of the replica agent inside the app. Not exposed on your network.
  hosts:
    name: Field Agents
    description: Other machines running the SMART Sniffer agent. Added from the Control Center.
  card_order:
    name: Card Order
    description: The order of the cards in the Control Center. Set by dragging the cards there.
  hidden_cards:
    name: Hidden Cards
    description: Cards hidden with the eye in the Control Center. Shown again from there.
  thresholds:
    name: Thresholds
    description: Alert thresholds of drives that are not in Home Assistant, one line per card and label. Set from a drive's Details in the Control Center; a drive in Home Assistant keeps its thresholds in the integration.
  card_names:
    name: Card Names
    description: Names given to cards in the Control Center, one line per card. A drive or pool in Home Assistant takes the name there too, as its device name.
  host_names:
    name: Machine Names
    description: Names given to field agents' machines in the Control Center, shown on every card of that machine.
network:
  9099/tcp: SMART Sniffer Agent API
